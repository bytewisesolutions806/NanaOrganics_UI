services:
  storefront:
    image: nana-ui:latest
    container_name: nana-ui
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_USE_MOCK_API: ${NEXT_PUBLIC_USE_MOCK_API:-false}
        NEXT_PUBLIC_VENDURE_SHOP_API_URL: ${NEXT_PUBLIC_VENDURE_SHOP_API_URL:?NEXT_PUBLIC_VENDURE_SHOP_API_URL is required}
        NEXT_PUBLIC_VENDURE_CHANNEL_TOKEN: ${NEXT_PUBLIC_VENDURE_CHANNEL_TOKEN:-}
        ALLOW_LOCAL_IMAGE_IP: ${ALLOW_LOCAL_IMAGE_IP:-false}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3001:3001"
