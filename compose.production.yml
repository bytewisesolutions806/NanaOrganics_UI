services:
  storefront:
    image: ${FRONTEND_IMAGE_REPOSITORY:-nana-ui}:${IMAGE_TAG:-latest}
    container_name: ${STOREFRONT_CONTAINER_NAME:-nana-ui}
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_USE_MOCK_API: ${NEXT_PUBLIC_USE_MOCK_API:-false}
        NEXT_PUBLIC_VENDURE_SHOP_API_URL: ${NEXT_PUBLIC_VENDURE_SHOP_API_URL:?NEXT_PUBLIC_VENDURE_SHOP_API_URL is required}
        NEXT_PUBLIC_VENDURE_CHANNEL_TOKEN: ${NEXT_PUBLIC_VENDURE_CHANNEL_TOKEN:-}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:?NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY is required}
        ALLOW_LOCAL_IMAGE_IP: ${ALLOW_LOCAL_IMAGE_IP:-false}
    restart: unless-stopped
    init: true
    ports:
      - "${STOREFRONT_BIND_ADDRESS:-127.0.0.1}:${STOREFRONT_PORT:-3001}:3001"
